name: Build APK

# Builds the app on GitHub's runners, so an APK can be produced without a local
# Android SDK. Debug APKs are always built; a signed release APK is built on top
# of that when the signing secrets are configured (see
# .github/workflows/README.md). Pushing a v* tag additionally publishes a GitHub
# Release with the APKs attached, which gives a download link that does not
# require being signed in.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Exposed to `if:` below; the secrets context itself is not usable there.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        # The document-detection model is committed under app/models/, so this
        # needs no network access beyond the Gradle and Maven caches.
        run: >
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "RELEASE_STORE_FILE=keystore/release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-paperin}"
            echo "RELEASE_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } > keystore/keystore.properties
          echo "keystore decoded: $(stat -c%s keystore/release.jks) bytes"

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: >
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify debug APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*arm64-v8a*.apk | head -1)
          echo "== $APK ($(du -h "$APK" | cut -f1))"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK" | head -6
          echo "== permissions"
          "${BUILD_TOOLS}aapt2" dump permissions "$APK"
          # The app must be unable to open a socket: fail if a merged dependency
          # brought INTERNET back in.
          if "${BUILD_TOOLS}aapt2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::INTERNET permission ended up in the APK"
            exit 1
          fi

      - name: Verify release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
          echo "== $APK ($(du -h "$APK" | cut -f1))"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK" | head -6
          if "${BUILD_TOOLS}aapt2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::INTERNET permission ended up in the APK"
            exit 1
          fi

      - name: List build outputs
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -printf '%p  %k KB\n' 2>/dev/null || true

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: PaperIn-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APKs
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: PaperIn-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # Attaches the APKs to a public GitHub Release when a v* tag is pushed.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APKs
        uses: actions/download-artifact@v4
        with:
          name: PaperIn-debug-${{ github.sha }}
          path: dist/debug

      - name: Download release APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PaperIn-release-${{ github.sha }}
          path: dist/release

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: PaperIn ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            PaperIn ${{ github.ref_name }}

            完全离线的文档扫描应用：不申请网络权限，模型与 OCR 语言包随包分发。
            A fully offline document scanner: no INTERNET permission, model and OCR
            language data bundled in the APK.

            **下载哪个？** 绝大多数手机选 `arm64-v8a`；2016 年前的老设备选
            `armeabi-v7a`；模拟器和 x86 平板选 `x86_64`。
            调试包（debug）与发布包（release）签名不同，二者不要混装。

            本应用是 FairScan 的修改版本，依据 GNU GPLv3 分发，源码即本仓库。
          files: |
            dist/debug/*.apk
            dist/release/*.apk
          fail_on_unmatched_files: false
